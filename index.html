<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="meta-theme-color" content="#0B0B0C" />
    <script>
      // Anti-FOUC: resuelve el tema ANTES del primer paint. Sin preferencia
      // guardada el default es dark; solo 'system' sigue prefers-color-scheme.
      // Espejo de readStoredPreference en src/lib/ThemeContext.tsx.
      ;(function () {
        var pref = null
        try { pref = localStorage.getItem('veredikt-theme') } catch (e) {}
        var resolved =
          pref === 'light' || pref === 'dark'
            ? pref
            : pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = resolved
        var meta = document.getElementById('meta-theme-color')
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#FFFFFF' : '#0B0B0C')
      })()
    </script>
    <title>VEREDIKT — El veredicto del mercado.</title>
    <meta name="description" content="Predice en VEREDIKT — el veredicto del mercado." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VEREDIKT" />
    <meta property="og:title" content="VEREDIKT — El veredicto del mercado." />
    <meta property="og:description" content="Predice en VEREDIKT — el veredicto del mercado." />
    <meta property="og:image" content="https://veredikt.mx/og-default.png" />
    <meta property="og:url" content="https://veredikt.mx/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>
